<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/personal-log/favicon.svg" />
    <link rel="apple-touch-icon" href="/personal-log/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Personal Log</title>
    <script>
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          var stored = JSON.parse(
            localStorage.getItem("personal-log:settings") || "{}"
          );
          if (stored.theme === "dark") dark = true;
          if (stored.theme === "light") dark = false;
        } catch (error) {}
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <script type="module" crossorigin src="/personal-log/assets/index-D4m1fphV.js"></script>

  <body>
    <div id="root"></div>
  </body>
</html>
